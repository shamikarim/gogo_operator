[workspace]
authors = ["Shamistan Karimov <ahresgg@gmail.com>"]
channels = [
  "conda-forge",
  "https://prefix.dev/motion-stack",
]
name = "gogo_operator"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
operator = "gogo-operator"
operator-zenoh = "gogo-operator --transport zenoh"
test = "pytest"

[dependencies]
python = ">=3.10,<3.15"
pytest = "*"
pytest-asyncio = "*"
gogo_keyboard = ">=1.0.3"
urwid = "*"

[pypi-dependencies]
motion_stack = { git = "ssh://git@github.com/2lian/motion-stack-2.git", subdirectory = "src/motion_stack" }
ms_moonbot_zero = { git = "ssh://git@github.com/2lian/motion-stack-2.git", subdirectory = "src/ms_moonbot_zero" }
ms_pyzeros_bridge = { git = "ssh://git@github.com/2lian/motion-stack-2.git", subdirectory = "src/ms_pyzeros_bridge" }
ms_zenoh_bridge = { git = "ssh://git@github.com/2lian/motion-stack-2.git", subdirectory = "src/ms_zenoh_bridge" }
pyzeros = { git = "ssh://git@github.com/2lian/pyzeros2.git" }
gogo_operator = { path = ".", editable = true }
