[build-system]
requires = ["setuptools>=58.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gogo-operator"
version = "0.1.0"
description = "Transport-independent terminal operator for Motion Stack 2"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [
    { name = "Shamistan Karimov", email = "ahresgg@gmail.com" }
]
dependencies = [
    "motion-stack",
    "asyncio-for-robotics",
    "gogo-keyboard",
    "numpy-quaternion",
    "urwid",
]

[project.optional-dependencies]
pyzeros = ["ms-pyzeros-bridge", "pyzeros"]
zenoh = ["ms-zenoh-bridge"]
all = ["ms-pyzeros-bridge", "ms-zenoh-bridge", "pyzeros"]

[project.scripts]
gogo-operator = "gogo_operator.cli:main"

[tool.setuptools]
packages.find.include = ["gogo_operator", "gogo_operator.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

